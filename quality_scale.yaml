# Gap-list against the Home Assistant integration quality scale.
#
# WHY THIS FILE EXISTS AND WHAT IT IS NOT. The quality scale is this
# component's build standard. Bronze is the floor for anything shipped; Silver
# is the target for anything reading a device, a service, or another
# integration's entities. This is integration_type: device polling real hosts
# over ssh, so SILVER IS THE TARGET. See #2.
#
# NOTHING VALIDATES THIS FILE. hassfest's validate_iqs_file opens with
# `if not integration.core: return`, so a custom component's quality_scale.yaml
# is never read -- while manifest.json's schema still ACCEPTS a quality_scale
# key. A tier declared there would be a self-claim with no gate behind it, and
# this repo still does not declare one.
#
# BRONZE AND SILVER ARE BOTH MET by this file's own reckoning -- every rule
# below is done or exempt -- and the manifest key stays absent anyway, because
# the reason for leaving it out was never that a tier was unmet. It is that
# the key asserts a tier nothing checks. The evidence is this file and the run
# it cites; a word in the manifest would add a claim without adding a check.
#
# GOLD IS NOT CLAIMED AND ITS RULES ARE NOT ASSESSED. See the scope note
# below: twenty-one rows nobody is aiming at would be padding, not evidence.
#
# SCOPE: BRONZE AND SILVER ONLY, deliberately. hassfest's SCHEMA requires an
# entry for every rule in ALL_RULES, Gold and Platinum included, so this file
# would not validate if it ever were validated. Assessing twenty-one Gold rules
# for a tier nobody is aiming at produces padding, not evidence. Add them when
# Gold becomes the target.
#
# Rule names are read from ALL_RULES in home-assistant/core's
# script/hassfest/quality_scale.py, never from the docs page, which names the
# tiers and not the rules. Read at core@dev on 2026-09-11.

rules:
  # --- BRONZE ---------------------------------------------------------------

  action-setup:
    status: exempt
    comment: >
      The integration registers no actions. Everything it offers is an entity:
      the update entity's install, the reboot button's press. There is no
      services.yaml and no async_register_admin_service call, so there is
      nothing for this rule to move out of async_setup_entry.

  appropriate-polling: done
  # UPDATE_INTERVAL is 60s for the fast block (uptime, load, memory, disk,
  # temperature), and the expensive apt/kernel block runs on its own longer
  # sub-interval inside that loop with its own retry interval on failure. A
  # host's patch state does not move minute to minute; its reachability does.

  brands: done
  # REVERSED, AND THE REASON THE EXEMPTION GAVE IS THE THING THAT CHANGED. This
  # read `exempt` on the grounds that brands means an accepted PR against
  # home-assistant/brands, which takes core integrations only. That stopped
  # being the whole of it in Home Assistant 2026.3: a custom component now
  # ships its own brand images in a top-level `brand/` directory, and
  # `homeassistant/components/brands` serves them from
  # `/api/brands/integration/<domain>/<image>` AHEAD of the CDN. `brand/` here
  # carries icon, logo and dark_logo at 1x and 2x.
  #
  # hacs/action's own brands validator reads the same directory --
  # custom_components/hacs/validate/brands.py resolves `brand/icon.png` at the
  # repository root under content_in_root and returns before it ever queries
  # brands.home-assistant.io -- so `ignore: brands` has come out of
  # validate.yml. The rule is checked now rather than argued around.
  #
  # `dark_icon` is deliberately absent: the swirl is one crimson on
  # transparency and reads on either theme, and the brands fallback chain
  # serves icon.png for a missing dark_icon. Only the wordmark needed a dark
  # variant, because it is black.

  common-modules: done
  # coordinator.py holds the single DataUpdateCoordinator; entity.py holds the
  # one base class carrying DeviceInfo, unique_id and the availability rule.
  # No platform defines a second coordinator or a second DeviceInfo.

  config-flow: done
  # config_flow: true in the manifest, config_flow.py present, one entry per
  # host, no YAML import path. strings.json carries data_description for the
  # two fields whose consequences are not obvious from the label (ssh_user,
  # offline_expected) and for both options fields.

  config-flow-test-coverage: done
  # 99% of config_flow.py, measured -- one uncovered line. tests/
  # test_config_flow.py covers the user step (probe reaches the host, an
  # unreachable host is a refusal, an offline host must be named by hand, a
  # duplicate aborts), both reauth outcomes, and the options flow's sudo gate
  # on the transition to true, on withdrawal, and on an entry that already had
  # it. test_probe.py covers the machinery underneath: _probe asserted on its
  # ARGV rather than its answer -- the key, the account, the address,
  # BatchMode -- because a probe that reaches the right host by the wrong
  # channel certifies nothing, which is the whole of this repo's worked
  # example. Plus every failure landing on None, and _probe_sudo answering
  # False on a host that could not be asked.

  dependency-transparency: done
  # requirements is [] -- there is no PyPI dependency to be transparent about.
  # The integration shells out to the ssh binary already present in the Home
  # Assistant container, which is a runtime assumption rather than a
  # dependency this rule governs. Recorded here so the empty list is read as
  # deliberate rather than as an omission.

  docs-actions:
    status: exempt
    comment: No actions to document -- see action-setup.

  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.

  docs-high-level-description: done
  # README opens with what the integration is, what it reads, and the fact
  # that every reading comes over ssh with nothing installed on the host.

  docs-installation-instructions: done
  # README ## Install: HACS custom repository, the category, the restart, and
  # why the integration lives at the repository root (hacs.json
  # content_in_root).

  docs-removal-instructions: done
  # README ## Removal, added in #14. It says how, and then says what removal
  # DESTROYS: the entry takes this integration's .storage ledger with it, and
  # that ledger is the only record of each pending security package's
  # first-seen and of the last applied upgrade. Neither is reconstructible
  # from recorder history, which keeps the published surface and not the rows
  # behind it, so re-adding the host restarts both clocks at zero
  # and under-reports patch age. Names the file, says to copy it first, and
  # says what deliberately survives -- the SSH key and known_hosts are the
  # operator's, not this integration's.

  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.

  entity-event-setup:
    status: exempt
    comment: >
      Nothing here subscribes to events from a library. Every entity is a
      CoordinatorEntity reading a polled dict; there is no push channel to
      attach or detach, so there is nothing to move into
      async_added_to_hass/async_will_remove_from_hass.

  entity-unique-id: done
  # Assigned once in LinuxMonitorEntity.__init__ as
  # <configured hostname, lowercased>_<platform key>, and FROZEN: it is built
  # from entry.data's hostname and the platform's own key, neither of which the
  # Glances removal touched.

  has-entity-name: done
  # _attr_has_entity_name = True on the shared base, so every platform
  # inherits it and no platform can quietly opt out.

  runtime-data: done
  # entry.runtime_data holds the coordinator, typed through the
  # LinuxMonitorConfigEntry alias in __init__.py. No hass.data[DOMAIN].

  test-before-configure: done
  # THE RULE THIS REPO IS THE WORKED EXAMPLE OF. The old flow asked a Glances
  # daemon for
  # a hostname while the integration polled over ssh, so an entry was created
  # against an ssh account that did not exist on that machine, read healthy for
  # weeks on the other channel, and went dark the day the daemon broke. The
  # flow now probes over THE SSH CREDENTIAL THE ENTRY WILL POLL WITH -- same
  # account, same key, same address -- and the options flow proves the sudo
  # grant the same way, with `sudo -n true`, before it will store
  # allow_install. An unreachable host is a refusal, not a pass.

  test-before-setup:
    status: exempt
    comment: >
      DEVIATION, RULED, AND RECORDED RATHER THAN SKIPPED. The rule's
      coordinator example raises UpdateFailed/ConfigEntryNotReady when the
      device or service cannot be reached. This coordinator NEVER raises, by
      contract: a monitor that disappears with its subject cannot report the
      subject down, and an unavailable entity's attributes vanish, which is
      how a broken collector reads green. async_config_entry_first_refresh is
      called, and _async_update_data always returns a dict, so setup cannot
      fail on an unreachable host -- which is the correct behaviour for an
      entry that may legitimately be created for a host marked
      offline_expected. What this rule protects against is covered earlier
      instead, at configure time, by test-before-configure.

  unique-config-entry: done
  # async_set_unique_id(hostname.lower()) then _abort_if_unique_id_configured,
  # with already_configured in strings.json. Keyed on the host's own reported
  # name rather than the address, so one host added twice under two addresses
  # is still one entry.

  # --- SILVER ---------------------------------------------------------------

  action-exceptions: done
  # Both actions raise on every refusal they can know about, and on every
  # failure that proves the command never ran. update.async_install always
  # did; the reboot button gained it in #11, where it had been logging at INFO
  # so a press against an unreachable host looked exactly like one that
  # worked.
  #
  # The button lets EXACTLY ONE failure class through: SSH_TRANSPORT_LOST,
  # because that is what a successful reboot looks like from this end -- it
  # tore down the session carrying its own result. A class rather than "any
  # error", so a refused sudo or a dead host cannot hide inside it.

  config-entry-unloading: done
  # async_unload_entry forwards to async_unload_platforms; the update listener
  # is registered through entry.async_on_unload. No unmanaged subscriptions:
  # the coordinator holds no transport open between polls -- each poll is a
  # separate ssh subprocess that has already exited.

  docs-configuration-parameters: done
  # Both options carry data_description in strings.json, and README's
  # "Remote patching and reboot" section states what allow_install actually
  # grants, what is probed before it is stored, and that turning it off is
  # never gated.

  docs-installation-parameters: done
  # README ## Configuration lists every config-flow field; strings.json
  # carries data_description for ssh_user and offline_expected, the two whose
  # consequences are not obvious from the label -- offline_expected in
  # particular is load-bearing rather than cosmetic and MASKS a host's
  # disappearance if set carelessly, which the description says.

  entity-unavailable: done
  # LinuxMonitorEntity.available takes an individual reading unavailable when
  # its source is missing or the host is offline_expected.
  #
  # TWO ENTITIES DELIBERATELY OVERRIDE THAT AND STAY AVAILABLE: the health
  # binary_sensor and the reboot counter. That is the never-raise contract, not
  # an oversight -- those two exist to REPORT the host's absence, and an
  # entity that goes unavailable with its subject cannot. Recorded here rather
  # than left to be re-derived: the exception is per-entity and ruled, so the
  # rule is met everywhere it governs.

  integration-owner: done
  # codeowners: ["@jrackerby"] in manifest.json.

  log-when-unavailable: done
  # Coordinator._track logs ONCE at the crossing and ONCE on recovery, naming
  # the missed-poll count, rather than every 60s -- a warning that repeats
  # every poll is as unreadable as no warning. It crosses at
  # TRANSPORT_FAIL_DWELL consecutive misses rather than the first miss, which
  # is the same threshold the health binary_sensor reports on, so the log and
  # the entity cannot disagree about when a host went down.

  parallel-updates: done
  # 0 on all four platforms: every entity is coordinator-driven and none
  # implements async_update, so there is no per-entity poll to throttle.
  #
  # The two ACTION platforms record what the constant cannot do for them, so
  # the next reader does not mistake the 0 for a considered safety property
  # that is missing. Home Assistant builds one semaphore per (config entry,
  # platform), so no value here could ever stand between an install and a
  # reboot press -- they live in different platforms. That guard is
  # coordinator.install_in_progress, which button.py reads (#11).

  reauthentication-flow:
    status: done
    comment: >
      Added in #13, and it declines the rule's own instrument, which is a
      DEVIATION and is recorded here rather than left to be re-derived.

      ConfigEntryAuthFailed is not raised. Raising from the polling path
      leaves coordinator.data at the previous poll while last_update_success
      goes false, and the two entities that override `available` to stay up
      would then go on publishing the last good reading -- so a host whose key
      was revoked would read HEALTHY on the one surface built to say
      otherwise. That is precisely what the never-raise contract exists to
      refuse. coordinator._check_auth calls
      entry.async_start_reauth directly and the poll still returns a truthful
      dict, so the operator gets the card AND the sensor stays honest.

      What triggers it is ssh's own permission-denied on SSH_AUTH_FAIL_DWELL
      consecutive polls, never a timeout: _classify_ssh separates auth from
      unreachable, host-key and transport-lost, and an unrecognised 255 lands
      on unreachable because a reauth card nobody can satisfy is worse than
      the reverse. The form re-probes over the account, key and address the
      entry will poll with, and asks the host its own name -- a credential
      that works but answers to a different hostname is not this entry's
      host.

  test-coverage:
    status: done
    comment: >
      227 tests, 807 of 807 statements, on homeassistant 2026.9.1 -- the
      version you run. Measured, and now GATED at that figure:
      --cov-fail-under=100 in the workflow, set from the run rather than
      chosen in advance. Parking the gate at the scale's 95% while the suite
      achieves 100% would license exactly that much silent rot.

      The rule's own wording is "above 95%", so this exceeds it rather than
      reinterpreting it.

      What closed the gap was mounting the platforms. sensor.py and
      binary_sensor.py sat at 0% because nothing set an entry up through
      async_setup_entry; one fixture that does, with only the ssh subprocess
      replaced, now exercises the platform forwards, the entity registry,
      DeviceInfo off the ssh read, and -- first time anywhere -- the
      availability overrides the never-raise contract asks for: that health
      and the reboot counter stay up while their subject is down.

      ONE LINE WAS DELETED RATHER THAN COVERED. entity.py's _metric had no
      callers, and dead code is unreachable by definition, so it was the
      reason that module could never finish. A coverage figure earned by
      exercising dead code would be the number wearing a disguise. Verified
      across every .py, .md and .json in the tree before removing it.

      A line that genuinely cannot be exercised takes `# pragma: no cover`
      and the comment saying why -- a reviewable claim, unlike a threshold
      quietly lowered.

      Also satisfied: the requirement that the suite's third-party imports be
      declared BESIDE it rather than in the workflow.
      requirements_test.txt does that, and tests/test_declared_dependencies.py
      checks it statically by AST on every commit.
