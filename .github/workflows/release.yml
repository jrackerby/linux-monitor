name: release

# Tagging and the release live in jrackerby/gha-workflows
# release-integration.yml (workflow_call); this file keeps the trigger:
# a push to master that touches manifest.json, whose own `version` is the
# number Home Assistant already shows (jrackerby/HA#821).

on:
  push:
    branches: [master]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jrackerby/gha-workflows/.github/workflows/release-integration.yml@master
