[pytest]
testpaths = tests
# The workflow checks the repository out into src/ so it can build the staged
# layout at the workspace root. That copy carries the integration's own
# __init__.py, so it is a package -- keep collection out of it.
norecursedirs = src .git __pycache__
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Importlib import mode rather than the default prepend: module identity comes
# from the path relative to rootdir instead of from a walk up through
# __init__.py files, which is one less thing for this repo's unusual layout to
# interact with.
#
# IT IS NOT WHAT FIXES THAT LAYOUT, and an earlier version of this comment
# said it was. The fault was never module naming -- pytest makes any directory
# holding an __init__.py a Package collector and Package.setup() imports that
# __init__.py, so a repo whose ROOT is a package gets its own __init__.py
# imported with no parent whatever the import mode. The fix is the staged
# layout the `tests` job builds; tests/conftest.py carries the measurement.
addopts = -q --strict-markers --import-mode=importlib
# custom_components is a namespace package (no __init__.py), here and in a
# real Home Assistant config directory alike.
consider_namespace_packages = true
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
