[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# IMPORTLIB IMPORT MODE, NOT THE DEFAULT PREPEND. The integration's package
# __init__.py lives at the REPOSITORY ROOT (hacs.json content_in_root), so the
# rootdir itself looks like a Python package. Under prepend, pytest derives a
# test module's name by walking up through directories that contain an
# __init__.py -- which here walks out of tests/, into the repo root, and ends
# up importing this integration's own __init__.py as a top-level module with
# no parent, so its `from .const import ...` raises. importlib mode derives
# the name from the path relative to rootdir and never walks, which removes
# the ambiguity rather than working around it.
addopts = -q --strict-markers --import-mode=importlib
# custom_components is a namespace package (no __init__.py), here and in a
# real Home Assistant config directory alike.
consider_namespace_packages = true
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
